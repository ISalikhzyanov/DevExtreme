name: Publishing to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Build type: 'daily' for timestamped alpha builds, 'release' for clean stable versions"
        type: choice
        options:
          - daily
          - release
        default: 'daily'
        required: false
      filter:
        type: string
        description: Package file filter pattern (e.g. 'devextreme-react')
        required: false

env:
  NX_SKIP_NX_CACHE: true

jobs:
  build:
    name: Build packages
    runs-on: windows-latest
    env:
      FILTER: ${{ github.event.inputs.filter || '' }}
      SET_TIMESTAMP_VERSION: ${{ github.event.inputs.tag == 'daily' }}
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: |
            ${{ env.PNPM_STORE_PATH }}
            .nx/cache
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set timestamp version (for daily builds)
        if: ${{ env.SET_TIMESTAMP_VERSION == 'true' }}
        run: pnpx ts-node tools/scripts/set-timestamp-version

      - name: Build npm packages
        env:
          BUILD_INTERNAL_PACKAGE: true
        run: pnpm run all:build

      - name: Build artifacts package
        run: npx ts-node tools/scripts/make-artifacts-package

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/npm/*.tgz
          retention-days: 2

      - name: Filter packages
        id: filter
        working-directory: artifacts/npm
        shell: bash
        run: |
          if [ -n "$FILTER" ]; then
            PKGS=$(ls *.tgz | grep -E -i "$FILTER" | sed -r 's/^(.*).tgz$/"\1"/g' | paste -sd "," -)
          else
            PKGS=$(ls *.tgz | sed -r 's/^(.*).tgz$/"\1"/g' | paste -sd "," -)
          fi
          echo "packages=[$PKGS]" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: build
    env:
      IS_RELEASE: ${{ github.event.inputs.tag == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build.outputs.packages) }}
    steps:
      - name: Get sources
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: |
            ${{ env.PNPM_STORE_PATH }}
            .nx/cache
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Change package scope and clean version (for release)
        id: scopedPackage
        env:
          PACKAGE: ${{ matrix.package }}
          IS_RELEASE: ${{ env.IS_RELEASE }}
        run: |
          SCOPE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PACKAGE_DIR=$(npx ts-node tools/scripts/change-package-scope --tgz "$PACKAGE.tgz" --scope "$SCOPE")
          echo "packageDir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          cd "$PACKAGE_DIR"

          ORIGINAL_VERSION=$(pnpm pkg get version --workspaces=false | tr -d '"')
          echo "Original version: $ORIGINAL_VERSION"

          if [ "$IS_RELEASE" = "true" ]; then
            CLEAN_VERSION=$(echo "$ORIGINAL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)(-.*)?/\1/')
            echo "Release mode: using clean version $CLEAN_VERSION"
          else
            CLEAN_VERSION="$ORIGINAL_VERSION"
          fi

          pnpm pkg set version="$CLEAN_VERSION" --workspaces=false

          pnpm pkg get name --workspaces=false | tr -d '"' | sed 's/.*/name=&/' >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "majorVersion=$(echo "$CLEAN_VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        working-directory: ${{ steps.scopedPackage.outputs.packageDir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          pnpm publish --no-git-checks --quiet --ignore-scripts --registry https://npm.pkg.github.com

      - name: Move 'daily' dist-tag
        if: ${{ github.event.inputs.tag == 'daily' }}
        env:
          PACKAGE_NAME: ${{ steps.scopedPackage.outputs.name }}
          PACKAGE_VERSION: ${{ steps.scopedPackage.outputs.version }}
          PACKAGE_VERSION_MAJOR: ${{ steps.scopedPackage.outputs.majorVersion }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          pnpm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$PACKAGE_VERSION_MAJOR-daily" --registry=https://npm.pkg.github.com

      - name: Move 'stable' dist-tag
        if: ${{ github.event.inputs.tag == 'release' }}
        env:
          PACKAGE_NAME: ${{ steps.scopedPackage.outputs.name }}
          PACKAGE_VERSION: ${{ steps.scopedPackage.outputs.version }}
          PACKAGE_VERSION_MAJOR: ${{ steps.scopedPackage.outputs.majorVersion }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          pnpm config set //npm.pkg.github.com/:_authToken="$NODE_AUTH_TOKEN"
          pnpm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$PACKAGE_VERSION_MAJOR-stable" --registry=https://npm.pkg.github.com